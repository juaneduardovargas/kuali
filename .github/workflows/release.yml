name: Release

# A tag is the only trigger: whatever `v*` points at is exactly what people
# install, so there is never a released build that no commit corresponds to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Releases are never cancelled halfway: a partially uploaded release is worse
# than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS bundle
    # Apple Silicon runner, which is what Kuali ships for.
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg-sha256: ${{ steps.checksums.outputs.dmg }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Read the version being released
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that disagrees with the manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          manifest=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$manifest" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json ($manifest)." >&2
            exit 1
          fi

      - name: Build the Chrome Web Store package
        run: npm --prefix browser-extension run package:store

      - name: Require Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required release secrets: ${missing[*]}" >&2
            exit 1
          fi

      # Kuali's releases have always carried written notes. An annotated tag
      # is where they come from, so the description lives with the commit it
      # describes instead of being retyped into the web interface afterwards.
      - name: Open the release with the notes from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release already exists; its notes are left as they are."
            exit 0
          fi
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" \
            --title "Kuali $VERSION" \
            --notes "${notes:-Kuali $VERSION.}" \
            --draft

      - name: Build the app and publish the release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri imports the Developer ID certificate, signs the app, and
          # submits it to Apple before the DMG is uploaded.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kuali ${{ steps.version.outputs.version }}
          # Keep every asset private until the resulting bundle passes the
          # local signature, Gatekeeper, and notarization-ticket checks below.
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Verify the Developer ID signature and notarization ticket
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Kuali.app"
          dmg="target/aarch64-apple-darwin/release/bundle/dmg/Kuali_${VERSION}_aarch64.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"

      - name: Checksum the disk image
        id: checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg="target/aarch64-apple-darwin/release/bundle/dmg/Kuali_${VERSION}_aarch64.dmg"
          digest=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          printf '%s  %s\n' "$digest" "$(basename "$dmg")" > "$dmg.sha256"
          echo "dmg=$digest" >> "$GITHUB_OUTPUT"

      - name: Attach the checksum and the extension package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "target/aarch64-apple-darwin/release/bundle/dmg/Kuali_${VERSION}_aarch64.dmg.sha256" \
            browser-extension/dist/*.zip \
            browser-extension/dist/*.zip.sha256 \
            --clobber

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  tap:
    name: Homebrew tap
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      # Publishing the release matters more than updating the cask, so a
      # missing token reports what to do instead of failing the release.
      - name: Check whether the tap can be updated
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the cask still points at the previous release. Update Casks/kuali.rb by hand or add the secret."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tap
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: igarrux/homebrew-kuali
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Point the cask at the release that was just published
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.macos.outputs.version }}
          SHA256: ${{ needs.macos.outputs.dmg-sha256 }}
        run: |
          sed -i -E "s/^  version \".*\"$/  version \"${VERSION}\"/" Casks/kuali.rb
          sed -i -E "s/^  sha256 \".*\"$/  sha256 \"${SHA256}\"/" Casks/kuali.rb
          if git diff --quiet Casks/kuali.rb; then
            echo "The cask already points at ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(cask): :bookmark: point Kuali at ${VERSION}"
          git push
